app-id: com.flectar.mail
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: flectar-mail
separate-locales: false

# The app already uses portals for browser and file-picker requests. Credential
# storage uses the freedesktop Secret Service. The Flatpak feature disables the
# legacy StatusNotifier tray backend so the sandbox needs no unsafe D-Bus name.
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --talk-name=org.freedesktop.secrets

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/pkgconfig
  - /share/man
  - '*.a'
  - '*.la'

modules:
  - name: flectar-mail
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_BUILD_JOBS: '1'
        CARGO_HOME: /run/build/flectar-mail/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo build --offline --locked --release --no-default-features --features remote-content,flatpak --bin flectar-mail
      - install -Dm0755 target/release/flectar-mail /app/bin/flectar-mail
      - install -Dm0755 pdfium-runtime/lib/libpdfium.so /app/lib/flectar-mail/libpdfium.so
      - python3 scripts/stage-linux-metadata.py --flatpak _flatpak-stage
      - install -Dm0644 _flatpak-stage/usr/share/applications/com.flectar.mail.desktop /app/share/applications/com.flectar.mail.desktop
      - install -Dm0644 _flatpak-stage/usr/share/metainfo/com.flectar.mail.metainfo.xml /app/share/metainfo/com.flectar.mail.metainfo.xml
      - install -Dm0644 resources/app-icon/flectar-mail-masked-512.png /app/share/icons/hicolor/512x512/apps/com.flectar.mail.png
      - install -Dm0644 resources/app-icon/flectar-mail-masked.svg /app/share/icons/hicolor/scalable/apps/com.flectar.mail.svg
      - install -Dm0644 LICENSE /app/share/licenses/flectar-mail/LICENSE
      - cp -a LICENSES /app/share/licenses/flectar-mail/LICENSES
      - install -Dm0644 THIRD_PARTY_NOTICES.md /app/share/doc/flectar-mail/THIRD_PARTY_NOTICES.md
      - install -Dm0644 resources/fonts/google-sans-flex/OFL.txt /app/share/licenses/flectar-mail/google-sans-flex/OFL.txt
      - install -Dm0644 resources/fonts/google-sans-flex/README.md /app/share/doc/flectar-mail/google-sans-flex/README.md
      - mkdir -p /app/share/licenses/flectar-mail/pdfium
      - cp -a pdfium-runtime/LICENSE pdfium-runtime/licenses /app/share/licenses/flectar-mail/pdfium/
    sources:
      # This local source makes the checked-in manifest build the exact commit
      # under test. The eventual Flathub repository will replace it with a
      # checksum-pinned archive of the stable upstream tag.
      - type: dir
        path: ../..
        skip:
          - .artifacts
          - .devcontainer
          - .env
          - .flatpak-builder
          - .git
          - .idea
          - .Trash-*
          - .vscode
          - libs
          - target
          - tmp
      - cargo-sources.json
      # Alpha bundles retain the same checksum-pinned PDF renderer as the other
      # native packages. A Flathub submission must source-build or feature-gate
      # this component before the stable release.
      - type: archive
        url: https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8044/pdfium-linux-x64.tgz
        sha256: eb142f416aed3a72fc5a02dbd5884868a16cb99dc0cf53e6bdd64afbf67b05f4
        dest: pdfium-runtime
        only-arches:
          - x86_64
