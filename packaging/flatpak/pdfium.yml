# PDFium for the PDF preview, built from source the way Flathub's YACReader
# package and Arch's libpdfium-nojs build it. JavaScript, XFA and the
# experimental Brotli decoder are left out, and PDFium uses the runtime's
# freetype, HarfBuzz, ICU, lcms2, libjpeg, libpng, OpenJPEG and zlib. Every
# revision below comes from the DEPS file of
# the chromium/8179 branch, the release scripts/stage-pdfium.py downloads for
# the other Linux packages.
name: pdfium
buildsystem: simple
build-commands:
  # Link abseil into libpdfium instead of building it as its own library.
  - sed -i -e 's/component(/static_library(/' -e 's/is_component_build(/false/' third_party/abseil-cpp/BUILD.gn
  # Use the runtime's ICU.
  - mkdir -p third_party/icu
  - ln -sf ../../build/linux/unbundle/icu.gn third_party/icu/BUILD.gn
  - install -Dm0644 generate_shim_headers.py tools/generate_shim_headers/generate_shim_headers.py
  # A standalone checkout has no gclient, which normally writes this file.
  - echo 'build_with_chromium = false' > build/config/gclient_args.gni
  - sed -i '/"\/\/third_party\/test_fonts",/s/^/#/' testing/BUILD.gn
  - sed -i '/public_deps +=.*libjpeg_headers/s/^/# /' core/fxcodec/BUILD.gn
  # GCC builds natively on aarch64, without a cross prefix or clang's flag.
  - sed -i 's/"aarch64-linux-gnu-"/""/' build/toolchain/linux/BUILD.gn
  - sed -i 's/"-mno-outline"/"-mno-outline-atomics"/' build/config/compiler/BUILD.gn
  - >-
    gn gen out/Release --script-executable=python3 --args='is_clang=false
    use_sysroot=false is_debug=false symbol_level=0 pdf_enable_v8=false
    pdf_enable_xfa=false pdf_enable_brotli=false treat_warnings_as_errors=false
    use_custom_libcxx=false
    pdf_is_standalone=true is_component_build=true pdf_use_partition_alloc=false
    pdf_use_libyuv=false pdf_bundle_freetype=false use_system_freetype=true
    use_system_harfbuzz=true use_system_lcms2=true use_system_libjpeg=true
    use_system_libopenjpeg2=true use_system_libpng=true use_system_zlib=true'
  - ninja -C out/Release pdfium
  - install -Dm0755 out/Release/libpdfium.so /app/lib/flectar-mail/libpdfium.so
  - install -Dm0644 LICENSE /app/share/licenses/flectar-mail/pdfium/LICENSE
  # Licenses of the code PDFium compiles in from its own third_party tree.
  - >-
    find third_party -maxdepth 3 \( -name 'LICENSE*' -o -name 'COPYING*' \) -type f
    -exec install -Dm0644 {} /app/share/licenses/flectar-mail/pdfium/{} \;
sources:
  - type: git
    url: https://pdfium.googlesource.com/pdfium
    # branch chromium/8179
    commit: 66ed17ef8fa00526ba3e2633361b6cc312321dc9
  - type: git
    url: https://chromium.googlesource.com/chromium/src/build.git
    commit: 0c62137b8623a3fab2c6aa5d7c94f719b3aa31f6
    dest: build
  - type: git
    url: https://chromium.googlesource.com/chromium/src/third_party/abseil-cpp
    commit: 56722f9eb6f40fb1a140caffd36e8f1f61b57aaf
    dest: third_party/abseil-cpp
  - type: git
    url: https://chromium.googlesource.com/chromium/src/third_party/simdutf
    commit: f7356eed293f8208c40b3c1b344a50bd70971983
    dest: third_party/simdutf
  - type: git
    url: https://chromium.googlesource.com/external/github.com/jk-jeon/dragonbox.git
    commit: beeeef91cf6fef89a4d4ba5e95d47ca64ccb3a44
    dest: third_party/dragonbox/src
  - type: git
    url: https://chromium.googlesource.com/external/github.com/fastfloat/fast_float.git
    commit: 42f254836ee416ffcf2f4e6576260003ac33d48c
    dest: third_party/fast_float/src
  - type: git
    url: https://chromium.googlesource.com/external/github.com/google/highway.git
    commit: 2607d3b5b0113992fe84d3848859eae13b3b52c1
    dest: third_party/highway/src
  # Chromium's tools/generate_shim_headers/generate_shim_headers.py at the
  # chromium/8179 branch head (41ae236192867501058795d2ccdb07b74aa09d64),
  # under Chromium's BSD license. It is kept here because Chromium's web view
  # of single files refuses automated downloads at times.
  - type: file
    path: generate_shim_headers.py
modules:
  # A build tool only, so none of it stays in the app.
  - name: gn
    buildsystem: simple
    cleanup:
      - '*'
    build-options:
      env:
        CXX: g++
    build-commands:
      # gn treats warnings as errors, and newer GCC releases warn on its code.
      - ./build/gen.py --allow-warnings
      - ninja -C out gn
      - install -Dm0755 out/gn /app/bin/gn
    sources:
      # The gn_version in the same DEPS file.
      - type: git
        url: https://gn.googlesource.com/gn
        commit: 98f6dd2be85d0eba8f31ee3ad1def5402383cff3
        # gen.py names the version after `git describe`.
        disable-shallow-clone: true
