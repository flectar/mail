<!doctype html>
<!-- A Google Play phone screenshot, 1080 x 1920: the screen from screen.html
     (screen.png, 800 x 1720 px) on Flectar's warm canvas. Play asks for 9:16
     screenshots and no device imagery, so the screen keeps a phone's
     proportions inside a plain border, without the buttons or camera of a
     particular phone. -->
<html>
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
body { background: oklch(96% 0.008 85); position: relative; }
img { position: absolute; left: 126px; top: 86px; width: 800px; height: 1720px;
  border: 14px solid #0d0f12; border-radius: 78px; background: #0d0f12;
  box-shadow: 0 44px 110px -44px oklch(20% 0.04 260 / 42%); }
</style>
</head>
<body>
<img src="screen.png" alt="" decoding="sync">
</body>
</html>
