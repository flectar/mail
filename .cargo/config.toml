# Keep every Cargo workspace and supported Rust target in this repository on
# one disposable build tree. Cargo resolves this relative path to <repo>/target.
[build]
target-dir = "target"
# Compiling Slint's generated library and test harness together can exhaust
# memory on a 16 GiB development host, including editor background checks.
# Larger builders can opt into more parallelism with Cargo's -j option.
jobs = 1

# Bundled SQLite otherwise allocates 20 cache pages in one block on a
# connection's first read. Releasing the cache frees the block, but the
# scheduler's reads every few seconds allocate it again. Chromium builds its
# SQLite the same way. Chromium also turns off the lookaside pool, but that
# made SQLite's speedtest1 lookups by rowid about 50% slower here.
[env]
LIBSQLITE3_FLAGS = "-DSQLITE_DEFAULT_PCACHE_INITSZ=0"

# Slint's desktop guide recommends matching Linux's larger main-thread stack on
# Windows. This prevents stack overflows in debug builds with deep UI trees.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8000000"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8000000"]

# NDK r27 and newer devices must agree on 16 KiB ELF load alignment. This also
# remains compatible with 4 KiB Android devices and matches bundled PDFium.
# `-z defs` turns a symbol the libraries lack into a link error. Without it,
# the app links and then fails to load at startup.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384", "-C", "link-arg=-Wl,-z,defs"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384", "-C", "link-arg=-Wl,-z,defs"]
