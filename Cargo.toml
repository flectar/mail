[workspace]
members = ["crates/flectar-mail-core", "crates/flectar-spell", "crates/renderer-probe"]
exclude = ["crates/blitz-dom", "crates/blitz-paint", "crates/fontique", "crates/i-slint-backend-android-activity", "crates/i-slint-backend-winit", "crates/i-slint-renderer-software", "crates/jmap-client", "crates/smithay-clipboard", "crates/spellbook", "crates/vello"]
resolver = "3"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }

[patch.crates-io]
blitz-dom = { path = "crates/blitz-dom" }
blitz-paint = { path = "crates/blitz-paint" }
# winit 0.30 doesn't report files dropped on a Wayland window, so they come
# through the clipboard's data device, as patches/slint-winit/README.md and
# patches/smithay-clipboard/README.md explain.
i-slint-backend-winit = { path = "crates/i-slint-backend-winit" }
smithay-clipboard = { path = "crates/smithay-clipboard" }
# Slint 1.19's software renderer panics on a rounded clip far out of view; see
# patches/slint-renderer-software/README.md.
i-slint-renderer-software = { path = "crates/i-slint-renderer-software" }
# Fontique 0.12 slants italics from a font's `slnt` axis the wrong way, so
# variable fonts without an italic face, such as the bundled Google Sans Flex,
# stay upright; see patches/fontique/README.md.
fontique = { path = "crates/fontique" }
# Vello drops Calibri's letters on the GPU; see patches/vello/README.md.
vello = { path = "crates/vello" }
# jmap-client makes its own HTTP clients, which can't take the app's proxy and
# TLS settings; see patches/jmap-client/README.md.
jmap-client = { path = "crates/jmap-client" }

[package]
name = "flectar-mail"
version = "0.1.0-alpha.7"
description = "A native email client built with Rust, Slint, and Blitz"
license = "AGPL-3.0-only"
repository = "https://github.com/flectar/mail"
homepage = "https://flectar.com"
publish = false
edition = "2024"
rust-version = "1.95"
build = "build.rs"
autobins = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "flectar-mail"
path = "src/desktop.rs"

[features]
# Desktop builds include both renderers. The saved runtime preference defaults
# to CPU, which does not initialize WGPU. Minimal/mobile builds opt out below.
default = ["remote-content", "gpu-renderer"]
gpu-renderer = [
    "dep:anyrender_vello",
    "dep:vello",
    "slint/renderer-femtovg-wgpu",
    "slint/unstable-wgpu-30",
]
# Normal builds include the bounded image-loader capability, but the persisted
# runtime setting remains off by default. `--no-default-features` omits all
# remote body-image loading code for a capability-free minimal build.
remote-content = []
# The Flatpak sandbox omits Slint's legacy StatusNotifierItem integration.
# Native packages retain the system tray and close-to-tray behavior.
flatpak = []
# Slint's documented iOS backend uses Skia. Keep it opt-in so desktop builds
# retain the smaller software-rendered dependency set.
ios = ["slint/renderer-skia"]

[dependencies]
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe"] }
anyrender = "0.14"
anyrender_vello = { version = "0.15", optional = true }
anyrender_vello_cpu = "0.18"
# AnyRender's geometry and paint types, for the scene adapter in
# src/renderer/cpu_scene.rs.
kurbo = "0.13.1"
peniko = "0.6"
# Email templates use CSS floats and legacy table/image align attributes.
# Keep float layout enabled on every platform, including minimal builds.
blitz-dom = { version = "=0.3.0-beta.4", features = ["floats"] }
blitz-html = "=0.3.0-beta.4"
blitz-paint = "=0.3.0-beta.4"
blitz-traits = "=0.3.0-beta.4"
base64 = "0.22"
percent-encoding = "2"
data-url = "0.3"
html5ever = "0.40"
# Snapshot archives one verified database snapshot for the document provider.
zip = { version = "9.0.4", default-features = false }
cssparser = "0.38"
# A quoted original keeps the look its style sheets gave it, as inline styles.
css-inline = { version = "0.23", default-features = false }
# Match Blitz's Stylo version when adapting resolved CSS colors and gradients.
style = { package = "stylo", version = "=0.22.0" }
style_traits = { package = "stylo_traits", version = "=0.22.0" }
unicode-segmentation = "1.13"
# Parley 0.12 includes the upstream emoji presentation fix.
parley = "=0.12.0"
pulldown-cmark = "0.13.6"
vello = { version = "0.11", optional = true }
# This native shell currently exposes keyword/FTS search, not local semantic
# search. Do not link Candle, tokenizers, or Hugging Face into every AppImage.
flectar-mail-core = { path = "crates/flectar-mail-core", default-features = false }
# Which words spelling checks, everywhere, and on Linux the checking itself, with the system's
# Hunspell dictionaries read in place from disk.
flectar-spell = { path = "crates/flectar-spell" }
# Slint and Blitz share Fontique 0.12, which loads Fontconfig dynamically so
# both rendering stacks agree on the native ABI.
fontique_0_12 = { package = "fontique", version = "=0.12.0", features = ["fontconfig-dlopen"] }
chrono.workspace = true
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
# The script type of cosmic-text's font fallback lists (src/han_fallback.rs).
unicode-script = "0.5"
image = { version = "0.25", default-features = false, features = ["gif", "ico", "jpeg", "png", "webp"] }
# Reads photos at a half, a quarter or an eighth of their size, to shrink them and to show
# them in the composer (src/photo_shrink.rs).
jpeg-decoder = { version = "0.3.2", default-features = false }
keyboard-types = "0.8"
# Flectar Mail Sync's pairing QR codes, drawn by the app itself.
qrcode = { version = "0.14", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
# Compares release versions for update notices (src/updates.rs).
semver = "1"
sha2 = "0.10"
serde.workspace = true
serde_json.workspace = true
sys-locale = "0.3"
tempfile = "3"
# The application paints its own controls on Slint's winit backend. Desktop
# Linux enables both Wayland and X11; Apple and Windows use their native winit
# integrations. Android supplies its dedicated activity backend separately.
# The `gpu-renderer` feature adds WGPU and exposes its device/queue to Vello.
slint = { version = "1.19.0", default-features = false, features = [
    "std",
    "renderer-software",
    "system-tray",
    "unstable-fontique-012",
    "compat-1-2",
] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "fs", "process"] }
tracing.workspace = true
unicode-properties = { version = "0.1", default-features = false, features = ["emoji"] }
url = "2"
webbrowser = "1.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# The Microsoft Store build's startup task and new-mail toasts are WinRT
# APIs, as are the accent colours of the taskbar's unread count; the toast
# activator is a COM server. Slint and wgpu already build
# this version of the crate.
windows = { version = "0.62", default-features = false, features = [
    "std",
    "ApplicationModel",
    "Data_Xml_Dom",
    "Foundation",
    "Foundation_Collections",
    "UI_Notifications",
    "UI_ViewManagement",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Com",
    "Win32_UI_Notifications",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# `windows::core::implement` expands to paths in this crate.
windows-core = { version = "0.62", default-features = false, features = ["std"] }
# A portable copy registers its toast identity; already in the build through
# the `windows` crate's dependents.
windows-registry = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Cargo cannot evaluate build.rs aliases; this is `linux_desktop`.
[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies]
# Portals use zbus's async-io backend, as Slint's tray already does. With
# zbus 5's `tokio` feature on, the tray connection's driver thread starts
# a Tokio runtime with one idle worker per CPU.
ashpd = { version = "0.11", default-features = false, features = ["async-std"] }
# The Flatpak serves `org.freedesktop.Application` for notification clicks
# with zbus's interface macro, which looks the crate up by name. The same
# version and backend as ashpd's. The blocking API asks the portal for the
# system's proxy from code that can't await (src/platform/system_proxy).
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
landlock = "0.4.7"
seccompiler = "0.5"
slint = { version = "1.19.0", default-features = false, features = ["backend-winit", "unstable-winit-030"] }
# Integrated window controls follow live desktop settings from the portal
# stream and ask X11 window managers for their window menu. Both crates are
# already part of the Linux build through ashpd and winit.
futures-util = { version = "0.3", default-features = false }
# Draws the tray's unread count in the app's typeface. Slint and cosmic-text
# already build this version.
swash = "0.2.10"
x11rb = { version = "0.13", default-features = false }
# A forwarded launch hands its activation token to the running window through
# winit's own Wayland connection. Winit already builds these crates with the
# same features.
wayland-backend = { version = "0.3", default-features = false, features = ["client_system"] }
wayland-client = { version = "0.31", default-features = false }
wayland-protocols = { version = "0.32", default-features = false, features = ["client", "staging"] }

# Integrated window frames use winit window attributes and native window events.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "ios"))'.dependencies]
slint = { version = "1.19.0", default-features = false, features = ["backend-winit", "unstable-winit-030"] }

# The integrated title bar adjusts the native window, which winit cannot
# change after creation, and the chosen app icon replaces the Dock icon.
# These AppKit bindings are already in the build.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "NSAccessibility", "NSApplication", "NSButton", "NSControl", "NSDockTile", "NSImage", "NSResponder", "NSRunningApplication", "NSSpellChecker", "NSView", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "NSAppleEventManager", "NSArray", "NSBundle", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSNotification", "NSOperation", "NSOrthography", "NSRange", "NSSet", "NSString", "NSTextCheckingResult", "NSURL", "NSUserDefaults"] }
# Launch Services reports a default email app change through a block.
block2 = { version = "0.6", default-features = false, features = ["std"] }
# Registers the bundled sign-in agent with Login Items (macOS 13+).
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }

# New-mail notifications through Apple's User Notifications. This is
# `user_notifications`; keep it in step with the alias in build.rs.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
block2 = { version = "0.6", default-features = false, features = ["std"] }
# Warms CoreText's Han font lookups off the UI thread (src/han_fallback.rs),
# and reads the system's proxy settings (src/platform/system_proxy).
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFBase", "CFDate", "CFDictionary", "CFError", "CFNumber", "CFRunLoop", "CFStream", "CFString", "CFURL"] }
objc2-core-text = { version = "0.3", default-features = false, features = ["std", "CTFont", "CTFontDescriptor"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSSet", "NSString"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "UNNotification", "UNNotificationAction", "UNNotificationCategory", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter", "UNError"] }

# Account secrets live in the iOS Keychain (src/platform/ios/security.rs), and
# sign-in uses the core's async OAuth broker trait (src/platform/web_authentication.rs).
# Spelling is checked with UITextChecker (src/platform/ios/spelling.rs).
[target.'cfg(target_os = "ios")'.dependencies]
async-trait = "0.1"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFData", "CFDictionary", "CFNumber", "CFString"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObjCRuntime", "NSRange"] }
objc2-security = { version = "0.3", default-features = false, features = ["std", "SecBase", "SecItem"] }
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "UITextChecker"] }

# This is `desktop`; keep it in step with the `mobile` alias in build.rs.
[target.'cfg(not(any(target_os = "android", target_os = "ios", target_env = "ohos")))'.dependencies]
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }
# The same async-io backend for the file chooser portal; see ashpd above.
rfd = { version = "0.16", default-features = false, features = ["async-std", "xdg-portal"] }
# The official MCP SDK, for `flectar-mail mcp`. Only that bridge process runs
# it; the running app answers the bridge over its own small protocol.
rmcp = { version = "3.10", default-features = false, features = ["server", "transport-io"] }

[package.metadata.appimage]
icon = "resources/app-icon/flectar-mail-masked-512.png"
desktop_entry = "resources/com.flectar.mail.desktop"
auto_link = true
auto_link_exclude_list = [
    "ld-linux*.so*",
    "libc.so*",
    "libdl.so*",
    "libgcc_s.so*",
    "libm.so*",
    "libpthread.so*",
    "librt.so*",
    "libstdc++.so*",
]

# The Fontique alias deliberately aligns a feature across Slint's and Blitz's
# transitive font stacks. `wayland-backend` is reached through
# `wayland_client::backend`; the direct dependency guarantees its
# `client_system` feature, which attaching to winit's display requires.
# `slint-build`, iOS-only `cc`, and Windows-only `winresource` are consumed by build.rs.
# Windows-only `windows-core` is named only by what `windows::core::implement`
# expands to.
# These do not appear as normal Rust paths on every host, so dependency
# scanners need the explicit exceptions.
[package.metadata.cargo-machete]
ignored = ["fontique_0_12", "wayland-backend", "slint-build", "winresource", "cc", "cfg_aliases", "rspolib", "windows-core"]

# tests/text_fit.rs measures laid-out text through Slint's item tree, which
# only the internal crate exposes. It must stay on the version `slint` uses.
[dev-dependencies]
i-slint-core = { version = "=1.19.0", default-features = false }
# src/updates.rs tests its schedule on tokio's paused clock.
tokio = { version = "1", features = ["macros", "test-util"] }
# src/platform/web_authentication.rs, which only iOS builds otherwise.
async-trait = "0.1"

[build-dependencies]
cc = "1"
cfg_aliases = "0.2"
# Reads the translation catalogs as Slint does, for notification words
# without the window (build.rs).
rspolib = "0.1.2"
slint-build = "1.19.0"
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"

# Full DWARF for this renderer/protocol dependency graph consumes many GiB and
# makes every integration-test binary expensive to link. Line tables preserve
# useful file/line backtraces while keeping development builds substantially
# smaller and less memory-hungry.
[profile.dev]
debug = 1

[profile.test]
debug = 1
