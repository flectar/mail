# OpenHarmony platform workspace.
#
# This mirrors the layout of `platform/android`: a separate cargo workspace that
# builds the OHOS shell artifacts (a cdylib loaded by the ArkTS hap) on top of
# the shared `flectar-mail` library. It is NOT part of the root workspace.
[workspace]
members = ["backend", "demo", "mail"]
resolver = "3"

[workspace.dependencies]
slint = { version = "=1.19.0", default-features = false, features = [
    "std",
    "renderer-software",
    # Slint requires a matching forward-compatibility feature at compile time.
    "compat-1-18",
    # The backend registers system fonts into Slint's shared fontique
    # collection (the OHOS font fallback for CJK text).
    "unstable-fontique-012",
    # Experimental GPU path: the femtovg renderer on wgpu 30 (EGL/GLES on
    # OHOS). Attempted by default at runtime with an automatic fallback to the
    # software renderer (disable the attempt with FLECTAR_OHOS_SOFTWARE=1).
    "renderer-femtovg-wgpu",
    "unstable-wgpu-30",
] }

# OpenHarmony is `target_os = "linux"` without Fontconfig. fontique's published
# `fontconfig-dlopen` feature tolerates the missing library and leaves the
# system backend empty; the backend registers `/system/fonts` explicitly.
#
# The patches mirror the root workspace: the application code depends on APIs
# from the patched copies, which the crates.io releases do not carry. Patches
# are workspace-local, so the nested workspace must repeat them.
[patch.crates-io]
blitz-dom = { path = "../../crates/blitz-dom" }
blitz-paint = { path = "../../crates/blitz-paint" }
# winit 0.30 doesn't report files dropped on a Wayland window, so they come
# through the clipboard's data device, as patches/slint-winit/README.md and
# patches/smithay-clipboard/README.md explain.
i-slint-backend-winit = { path = "../../crates/i-slint-backend-winit" }
smithay-clipboard = { path = "../../crates/smithay-clipboard" }
# Slint 1.19's software renderer panics on a rounded clip far out of view; see
# patches/slint-renderer-software/README.md.
i-slint-renderer-software = { path = "../../crates/i-slint-renderer-software" }
# Fontique 0.12 slants italics from a font's `slnt` axis the wrong way, so
# variable fonts without an italic face, such as the bundled Google Sans Flex,
# stay upright; see patches/fontique/README.md.
fontique = { path = "../../crates/fontique" }
# Vello drops Calibri's letters on the GPU; see patches/vello/README.md.
vello = { path = "../../crates/vello" }
# jmap-client makes its own HTTP clients, which can't take the app's proxy and
# TLS settings; see patches/jmap-client/README.md.
jmap-client = { path = "../../crates/jmap-client" }
