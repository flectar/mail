name: Google Play bundle

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Release version, for example 0.1.0-beta.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Android App Bundle for Google Play
    runs-on: ubuntu-24.04
    # This environment holds only the upload key. Google Play signs the copies
    # people install with its own copy of the app signing key, which this job
    # never sees. Same version sequence as the APKs on GitHub.
    environment: google-play
    env:
      FLECTAR_ANDROID_SIGNING_KEY: upload
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Restore the upload key
        env:
          FLECTAR_ANDROID_KEYSTORE_BASE64: ${{ secrets.FLECTAR_PLAY_UPLOAD_KEYSTORE_BASE64 }}
          FLECTAR_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FLECTAR_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          FLECTAR_ANDROID_KEY_ALIAS: upload
          FLECTAR_ANDROID_KEY_PASSWORD: ${{ secrets.FLECTAR_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
        run: bash scripts/restore-android-keystore.sh

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
      # The upload key signs whatever this job builds, so it never restores a
      # cache that another run saved.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true

      - name: Configure Android NDK compiler
        run: |
          # Slint's prebuilt Skia binaries need the C++ library of NDK r30 or
          # newer, and the runner's default NDK is older.
          ndk="$ANDROID_NDK_LATEST_HOME"
          toolchain="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$toolchain/aarch64-linux-android26-clang"
          {
            echo "ANDROID_NDK_ROOT=$ndk"
            echo "ANDROID_NDK_HOME=$ndk"
            echo "CC_aarch64_linux_android=$toolchain/aarch64-linux-android26-clang"
            echo "CXX_aarch64_linux_android=$toolchain/aarch64-linux-android26-clang++"
            echo "AR_aarch64_linux_android=$toolchain/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$toolchain/aarch64-linux-android26-clang"
          } >> "$GITHUB_ENV"

      - name: Make room for the release build
        # The app crate's release build peaks near all the memory a hosted
        # runner has; see scripts/ci-swap.sh.
        run: ./scripts/ci-swap.sh on
      - name: Build and validate the bundle
        env:
          FLECTAR_ANDROID_VERSION_NAME: ${{ inputs.version_name }}
          FLECTAR_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.FLECTAR_GOOGLE_ANDROID_CLIENT_ID }}
          FLECTAR_MICROSOFT_ANDROID_CLIENT_ID: ${{ secrets.FLECTAR_MICROSOFT_ANDROID_CLIENT_ID }}
          FLECTAR_MICROSOFT_ANDROID_REDIRECT_URI: ${{ secrets.FLECTAR_MICROSOFT_ANDROID_REDIRECT_URI }}
          FLECTAR_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FLECTAR_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          FLECTAR_ANDROID_KEY_ALIAS: upload
          FLECTAR_ANDROID_KEY_PASSWORD: ${{ secrets.FLECTAR_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          # Prereleases may leave out bundled sign-in, as their GitHub APKs do.
          args=()
          if [[ "$FLECTAR_ANDROID_VERSION_NAME" == *-* ]]; then args+=(--preview); fi
          ./scripts/ci-build-scope.sh ./scripts/build-android-release.sh "${args[@]}"
          mv target/android/release/flectar-mail.aab \
            "target/android/release/flectar-mail-$FLECTAR_ANDROID_VERSION_NAME.aab"

      - name: Remove restored signing key
        if: always()
        run: |
          if [[ -n "${FLECTAR_ANDROID_KEYSTORE:-}" ]]; then rm -f "$FLECTAR_ANDROID_KEYSTORE"; fi

      - name: Enable Android emulator acceleration
        run: sudo chmod a+rw /dev/kvm

      - name: Exercise packaged JNI callbacks
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          # The instrumentation APK uses the local debug key; the upload key is
          # only supplied to the build step above.
          FLECTAR_ANDROID_KEYSTORE: ""
        with:
          # Google APIs ARM64 translation tests the release Rust library.
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./platform/android/gradle/gradlew --no-daemon -p platform/android/gradle :app:connectedDebugAndroidTest

      - name: Upload JNI test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: google-play-jni-test-results
          path: |
            target/android/gradle/app/reports/androidTests/
            target/android/gradle/app/outputs/androidTest-results/

      # The APK from the same build is signed with the upload key and only
      # exists for the checks above, so only the bundle is kept.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flectar-mail-google-play-${{ inputs.version_name }}
          path: target/android/release/flectar-mail-*.aab
          if-no-files-found: error
          retention-days: 30
