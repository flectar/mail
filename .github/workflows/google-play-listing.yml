name: Google Play listing

# Makes the Google Play store listing match fastlane/metadata/android. A
# change there on main starts it, and every run waits for approval in the
# google-play environment.
on:
  push:
    branches:
      - main
    paths:
      - fastlane/metadata/android/**
      - "!fastlane/metadata/android/*/changelogs/**"
  workflow_dispatch:
    inputs:
      validate_only:
        description: Only check the changes with Google Play, without publishing them
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: google-play-listing
  cancel-in-progress: false

jobs:
  listing:
    name: Google Play store listing
    runs-on: ubuntu-24.04
    environment: google-play
    timeout-minutes: 15
    permissions:
      contents: read
      # The GitHub token that Google exchanges for Play access.
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check the listing against Google Play's rules
        run: python3 scripts/check-store-listing.py
      # Workload Identity Federation: Google trusts this repository's
      # google-play environment, so no Google key is stored anywhere.
      - name: Sign in to Google Play
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.FLECTAR_PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FLECTAR_PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Publish the listing
        env:
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          VALIDATE_ONLY: ${{ inputs.validate_only }}
        run: |
          args=()
          if [[ "$VALIDATE_ONLY" == true ]]; then args+=(--validate-only); fi
          python3 scripts/google-play.py listing "${args[@]}"
