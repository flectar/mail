name: iOS app source

# Publishes the AltStore source, which SideStore also reads, on GitHub Pages
# so sideloaded copies are offered each new release. platform/ios/README.md
# describes the one-time Pages setup.
on:
  workflow_run:
    workflows: [Native platform artifacts]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the AltStore source
    # Tag pushes are the release workflow's only push runs. This workflow
    # runs on the default branch, which the github-pages environment allows
    # to deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}source.json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check the Pages configuration
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Find the newest iOS app
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 scripts/ios-release.py latest "$RUNNER_TEMP/releases.json" | tee -a "$GITHUB_OUTPUT"

      - name: Download its IPA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.latest.outputs.tag }}
          ASSET: ${{ steps.latest.outputs.asset }}
        run: gh release download "$TAG" --pattern "$ASSET" --dir "$RUNNER_TEMP/downloads"

      - name: Write the source
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 scripts/ios-release.py site "$RUNNER_TEMP/releases.json" "$RUNNER_TEMP/downloads" \
            --url "$SITE_URL" --output "$RUNNER_TEMP/site"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
